name: CI for Pipex Project

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  norminette:
    name: Run Norminette
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          curl -sSL https://raw.githubusercontent.com/42School/norminette/master/norminette.sh | bash

      - name: Run Norminette
        run: norminette .

  build:
    name: Build Pipex Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make

      - name: Run Makefile
        run: make
